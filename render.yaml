services:
  - type: web
    name: unnayanai-frontend
    env: node
    rootDirectory: .
    buildCommand: bun install && bun run build
    startCommand: bun run start
    envVars:
      - key: NODE_VERSION
        value: "20"

  - type: web
    name: unnayanai-backend
    env: python
    rootDirectory: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: mock
      - key: SMS_PROVIDER
        value: mock
