services:
  - type: web
    name: unnayanai-frontend
    env: node
    buildCommand: npm run build
    startCommand: next start
    rootDirectory: /

  - type: web
    name: unnayanai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./unnayanai.db
      - key: LLM_PROVIDER
        value: mock
      - key: SMS_PROVIDER
        value: mock
    rootDirectory: backend
