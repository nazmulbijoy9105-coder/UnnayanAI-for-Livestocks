<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>উন্নয়ন গবাদি AI</title><style>body{margin:0;padding:40px;font-family:Arial;background:linear-gradient(90deg,#10b981,#3b82f6);color:white;text-align:center} h1{font-size:3rem} pre{background:#000;padding:20px;border-radius:10px;font-size:1.2rem} button{background:#ef4444;color:white;border:none;padding:15px 30px;font-size:1.1rem;border-radius:10px;cursor:pointer} input{padding:10px;margin:10px;font-size:1rem}</style></head><body><h1>🚀 উন্নয়ন গবাদি AI Live</h1><p>গরুর তাপমাত্রা চেক</p><input id="temp" type="number" placeholder="40" value="40"><button onclick="check()">চেক করুন</button><pre id="result">{"temp":40} → POST /api/health</pre><script>async function check(){const t=document.getElementById('temp').value;const res=await fetch('/api/health',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({t:parseFloat(t)})});const data=await res.json();document.getElementById('result').textContent=JSON.stringify(data,null,2);}</script></body></html>
